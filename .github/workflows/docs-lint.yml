name: docs-lint

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prüfabhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Agent Files prüfen
        run: python3 scripts/lint_docs.py
      - name: Registry-Verhalten prüfen
        run: python -m unittest discover -s scripts -p 'test_*.py'
